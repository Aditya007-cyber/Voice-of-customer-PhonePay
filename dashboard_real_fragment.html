<script>
(function () {
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD = iso => { const p = iso.slice(0,10).split('-'); return (+p[2]) + ' ' + MON[+p[1]-1]; };
const pct = (n, t) => t ? Math.round(100 * n / t) : 0;
const SRC = {play_store:'Play Store', app_store:'App Store', reddit:'Reddit', ticket:'Support ticket', sales_call:'Sales call', interview:'Interview', whatsapp:'WhatsApp screenshot'};
const W = D.meta.windows;
const inRecent = ts => ts > W.recent_start && ts <= W.end;
const inPrior = ts => ts > W.prior_start && ts <= W.recent_start;

// ---------- preprocess
const clusterTheme = {}; D.clusters.forEach(c => clusterTheme[c.cluster_id] = c.category);
const themes = D.themes.filter(t => t.category !== 'long_tail');
const themeBy = {}; D.themes.forEach(t => themeBy[t.category] = t);
D.records.forEach(r => { r.themes = [...new Set(r.clusters.map(c => clusterTheme[c.cluster_id]))]; r.sev = r.clusters.length ? Math.max(...r.clusters.map(c => c.severity)) : 0; });
const recById = Object.fromEntries(D.records.map(r => [r.id, r]));
const weeks = D.weekly_total.map(w => w[0]);
const weekTotals = D.weekly_total.map(w => w[1]);
const versionTotals = {}; D.records.forEach(r => { if (r.app_version) versionTotals[r.app_version] = (versionTotals[r.app_version] || 0) + 1; });
const hasPrior = themes.some(t => t.stats.total_prior > 0);  // false when the data spans under 14 days
themes.forEach(t => {
  const s = t.stats; t.pctR = pct(s.n_recent, s.total_recent); t.pctP = pct(s.n_prior, s.total_prior); t.delta = t.pctR - t.pctP;
  const m = Object.fromEntries(t.weekly); t.weekCounts = weeks.map(w => m[w] || 0); t.weekPct = t.weekCounts.map((n, i) => weekTotals[i] ? 100 * n / weekTotals[i] : 0);
});
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const state = { view: 'overview', theme: LS.get('voc-theme', null), sort: 'recent', f: { theme: '', source: '', version: '', win: '', churn: false, pain: true, q: '' }, shown: 60, status: LS.get('voc-status', {}) };
if (!themes.some(t => t.category === state.theme)) state.theme = themes[0].category;

// ---------- small components
function spark(vals) {
  const Wd = 88, H = 24, p = 3, max = Math.max(...vals, 1), n = vals.length;
  const x = i => p + i * (Wd - 2 * p) / (n - 1), y = v => H - p - (v / max) * (H - 2 * p);
  const pts = vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="Weekly share of feedback, trend"><polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + x(n - 1).toFixed(1) + '" cy="' + y(vals[n - 1]).toFixed(1) + '" r="2.5" fill="var(--accent)"/></svg>';
}
function pips(avg) { const k = Math.round(avg); let h = '<span class="pips" aria-hidden="true">'; for (let i = 1; i <= 5; i++) h += '<i class="' + (i <= k ? 'on' : '') + '"></i>'; return h + '</span>' + avg.toFixed(1); }
function deltaCell(d) { if (!hasPrior) return '<span class="muted small">n/a</span>'; const cls = d >= 3 ? 'up' : d <= -3 ? 'down' : 'flat'; const ic = d >= 3 ? '▲' : d <= -3 ? '▼' : '–'; return '<span class="delta ' + cls + '">' + ic + ' ' + (d > 0 ? '+' : '') + d + ' pp</span>'; }
function quoteCard(q) {
  return '<figure class="quote"><blockquote>“' + esc(q.quote) + '”</blockquote><figcaption><span class="mono">' + esc(q.record_id) + '</span><span>' + esc(SRC[q.source] || q.source) + ' · ' + fmtD(q.timestamp) + '</span><span class="ok">✓ verbatim</span><button class="linkish small" data-open="' + esc(q.record_id) + '">Open record</button></figcaption></figure>';
}
function hbars(rows) { // rows: [{label, n, total}]
  const max = Math.max(...rows.map(r => r.total ? r.n / r.total : 0), 0.0001);
  return rows.map(r => '<div class="hbar" data-tip="' + esc(r.label + ': ' + r.n + ' of ' + r.total + ' records (' + pct(r.n, r.total) + '%)') + '"><span>' + esc(r.label) + '</span><span class="bar"><i style="width:' + (100 * (r.n / r.total) / max).toFixed(1) + '%"></i></span><span class="v">' + r.n + ' of ' + r.total + ' · ' + pct(r.n, r.total) + '%</span></div>').join('');
}
function weeklyChart(t) {
  const Wd = 680, H = 210, L = 38, R = 8, T = 18, B = 30, n = weeks.length;
  const max = Math.max(...t.weekPct, 4); const step = [2, 4, 5, 10, 20, 25].find(s => 4 * s >= max) || 25; const top = 4 * step;
  const bw = (Wd - L - R) / n, y = v => T + (H - T - B) * (1 - v / top);
  let g = '<g class="axis">';
  for (let v = 0; v <= top; v += top / 4) g += '<line x1="' + L + '" x2="' + (Wd - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11">' + Math.round(v) + '%</text>';
  g += '</g>';
  let bars = '';
  weeks.forEach((w, i) => {
    const v = t.weekPct[i], x = L + i * bw + bw * 0.18, bwid = bw * 0.64, hi = i >= n - 2;
    const tip = 'Week of ' + fmtD(w) + ': ' + t.weekCounts[i] + ' of ' + weekTotals[i] + ' records (' + v.toFixed(0) + '%)';
    bars += '<rect data-tip="' + esc(tip) + '" x="' + x.toFixed(1) + '" y="' + y(v).toFixed(1) + '" width="' + bwid.toFixed(1) + '" height="' + Math.max(0, (H - B) - y(v)).toFixed(1) + '" rx="3" fill="' + (hi ? 'var(--accent)' : 'var(--accent-tint)') + '" stroke="' + (hi ? 'none' : 'var(--accent)') + '" stroke-width="1"/>';
    bars += '<text x="' + (x + bwid / 2).toFixed(1) + '" y="' + (y(v) - 5).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="600">' + Math.round(v) + '%</text>';
    bars += '<text x="' + (x + bwid / 2).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11">' + fmtD(w) + '</text>';
  });
  return '<svg viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="Share of weekly feedback mentioning ' + esc(t.label) + '" style="width:100%;height:auto;display:block">' + g + bars + '</svg>';
}
function matrix(recs) {
  const Wd = 680, H = 360, L = 52, R = 16, T = 16, B = 44;
  const x = e => L + (e - 0.5) * (Wd - L - R) / 5, y = v => T + (H - T - B) * (1 - v / 100);
  let s = '<g class="axis">';
  for (let v = 0; v <= 100; v += 25) s += '<line x1="' + L + '" x2="' + (Wd - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11">' + v + '</text>';
  for (let e = 1; e <= 5; e++) s += '<line x1="' + x(e) + '" x2="' + x(e) + '" y1="' + T + '" y2="' + (H - B) + '" stroke-dasharray="2 4"/><text x="' + x(e) + '" y="' + (H - B + 18) + '" text-anchor="middle" font-size="11">' + e + '</text>';
  s += '</g>';
  s += '<text x="' + (L + 8) + '" y="' + (T + 14) + '" font-size="12" font-weight="600" fill="var(--fg-3)" style="fill:var(--fg-3)">Quick wins</text>';
  s += '<text x="' + (Wd - R - 8) + '" y="' + (T + 14) + '" font-size="12" font-weight="600" text-anchor="end" style="fill:var(--fg-3)">Big bets</text>';
  s += '<text x="' + (Wd / 2 + 10) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="12">Effort (1 = days, 5 = multi-quarter)</text>';
  s += '<text transform="translate(14 ' + ((T + H - B) / 2) + ') rotate(-90)" text-anchor="middle" font-size="12">Impact score (0–100)</text>';
  recs.forEach(r => {
    s += '<g data-tip="' + esc('#' + r.rank + ' ' + r.title + ' · impact ' + r.impact + ' · effort ' + r.effort) + '"><circle cx="' + x(r.effort) + '" cy="' + y(r.impact) + '" r="13" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="' + x(r.effort) + '" y="' + (y(r.impact) + 4) + '" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--on-accent)">' + r.rank + '</text></g>';
  });
  return '<svg viewBox="0 0 ' + Wd + ' ' + H + '" role="img" aria-label="Recommendations placed by impact and effort" style="width:100%;height:auto;display:block">' + s + '</svg>';
}

// ---------- views
function viewOverview() {
  const rows = [...themes];
  const key = { recent: t => -t.stats.n_recent, rising: t => -t.delta, all: t => -t.stats.n_all };
  rows.sort((a, b) => key[state.sort](a) - key[state.sort](b));
  const riser = [...themes].sort((a, b) => hasPrior ? b.delta - a.delta : b.stats.n_recent - a.stats.n_recent)[0];
  const rec = D.recommendations.find(r => r.category === riser.category) || D.recommendations[0];
  const nPP = D.records.reduce((n, r) => n + r.clusters.length, 0);
  const lead = '<section class="card lead"><div class="eyebrow">' + (hasPrior ? 'Needs attention first' : 'Biggest pain point') + '</div><p class="big">' + esc(riser.finding) + '</p>' +
    '<div class="stat-row"><div class="stat"><b>' + riser.stats.n_recent + ' of ' + riser.stats.total_recent + '</b><span>records, last 14 days</span></div><div class="stat"><b>' + deltaCell(riser.delta) + '</b><span>' + (hasPrior ? 'vs previous 14 days' : 'no earlier period to compare') + '</span></div><div class="stat"><b>' + riser.stats.churn_records + '</b><span>of these mention leaving</span></div></div>' +
    (riser.quotes.length ? quoteCard([...riser.quotes].sort((a, b) => b.timestamp.localeCompare(a.timestamp))[0]) : '') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-theme-open="' + riser.category + '">See the evidence</button><button class="btn" data-go="recommendations">See the recommendation</button></div></section>';
  const strip = '<div class="stat-row" style="padding:2px 4px"><div class="stat"><b>' + D.meta.records + '</b><span>records analysed</span></div><div class="stat"><b>' + Object.keys(D.meta.sources).length + '</b><span>sources</span></div><div class="stat"><b>' + nPP + '</b><span>pain points extracted</span></div><div class="stat"><b>' + D.churn.length + '</b><span>churn signals</span></div><div class="stat"><b>' + themes.length + '</b><span>themes</span></div></div>';
  const body = rows.map(t => {
    const s = t.stats;
    return '<tr class="click" data-theme-open="' + t.category + '"><td class="theme-name">' + esc(t.label) + '<div class="muted small">' + s.n_all + ' records overall</div></td>' +
      '<td style="min-width:150px"><div style="display:flex;justify-content:space-between;gap:8px"><b>' + t.pctR + '%</b><span class="muted small">' + s.n_recent + ' of ' + s.total_recent + '</span></div><div class="bar" style="margin-top:4px"><i style="width:' + Math.min(100, t.pctR * 3) + '%"></i></div></td>' +
      '<td><span class="muted">' + (hasPrior ? t.pctP + '%' : '–') + '</span></td><td>' + deltaCell(t.delta) + '</td><td>' + spark(t.weekPct) + '</td><td>' + pips(s.avg_severity) + '</td><td>' + s.churn_records + '</td></tr>';
  }).join('');
  const table = '<section class="card flat"><div class="head" style="padding:16px 18px 0"><div><h2>Pain points, ranked</h2><p class="muted small">Share of all feedback records that mention each theme. Counts come from database queries, not from the model.</p></div>' +
    '<div class="seg" role="group" aria-label="Sort themes"><button data-sort="recent" aria-pressed="' + (state.sort === 'recent') + '">Last 14 days</button><button data-sort="rising" aria-pressed="' + (state.sort === 'rising') + '">Rising fastest</button><button data-sort="all" aria-pressed="' + (state.sort === 'all') + '">All time</button></div></div>' +
    '<div class="scroll"><table><thead><tr><th>Theme</th><th>Last 14 days</th><th>Previous 14</th><th>Change</th><th>Weekly trend</th><th>Severity (1–5)</th><th>Churn</th></tr></thead><tbody>' + body + '</tbody></table></div></section>';
  const src = D.meta.sources, srcTotal = D.meta.records;
  const srcCard = '<section class="card"><div class="head"><h3>Where the feedback comes from</h3><span class="muted small">Share of all records</span></div>' + Object.entries(src).map(([k, n]) => '<div class="hbar" data-tip="' + esc((SRC[k] || k) + ': ' + n + ' of ' + srcTotal) + '"><span>' + esc(SRC[k] || k) + '</span><span class="bar"><i style="width:' + (100 * n / Math.max(...Object.values(src))).toFixed(1) + '%"></i></span><span class="v">' + n + ' · ' + pct(n, srcTotal) + '%</span></div>').join('') + '<p class="muted small" style="margin:10px 0 0">' + (D.meta.synthetic ? 'Tickets, calls, interviews and screenshots are synthetic. Store and Reddit text would be real in a live setup.' : 'Public reviews only. People who write reviews are not a representative sample of all users. Reviewer names are not stored.') + '</p></section>';
  const pii = D.meta.pii_redacted, piiN = Object.values(pii).reduce((a, b) => a + b, 0);
  const safeCard = '<section class="card"><div class="head"><h3>Safety before analysis</h3></div><p style="margin:0 0 8px"><b>' + piiN + '</b> personal identifiers were removed before any text reached the analysis stages.</p><div class="tags">' + Object.entries(pii).map(([k, n]) => '<span class="chip small">' + esc(k.replace('_', ' ').toLowerCase()) + ' · ' + n + '</span>').join('') + '</div><p class="muted small" style="margin:10px 0 0">Quotes shown anywhere in this dashboard are checked to be word-for-word text from the redacted record. Quote check failures this run: <b>' + D.meta.quote_verification_failures + '</b>.</p></section>';
  return lead + strip + table + '<div class="grid2">' + srcCard + safeCard + '</div>';
}

function themeRecords(t) { return D.records.filter(r => r.themes.includes(t.category)); }
function viewThemes() {
  const t = themeBy[state.theme], s = t.stats;
  const picker = '<div class="chips" role="group" aria-label="Choose a theme">' + themes.map(x => '<button class="chip" data-pick="' + x.category + '" aria-pressed="' + (x.category === state.theme) + '">' + esc(x.label) + '</button>').join('') + '</div>';
  const srcRows = Object.entries(s.by_source).map(([k, n]) => ({ label: SRC[k] || k, n, total: s.source_totals[k] })).sort((a, b) => b.n / b.total - a.n / a.total);
  const verRows = Object.keys(versionTotals).sort().map(v => ({ label: 'App v' + v, n: s.by_version[v] || 0, total: versionTotals[v] }));
  const subs = D.clusters.filter(c => c.category === t.category).sort((a, b) => b.stats.n_all - a.stats.n_all);
  const head = '<section class="card"><div class="eyebrow">Theme</div><h2>' + esc(t.label) + '</h2><p class="finding">' + esc(t.finding) + '</p>' +
    '<div class="stat-row"><div class="stat"><b><button class="linkish" style="font-size:20px" data-rec="' + t.category + '|recent">' + s.n_recent + ' of ' + s.total_recent + '</button></b><span>last 14 days (click for records)</span></div><div class="stat"><b>' + s.n_prior + ' of ' + s.total_prior + '</b><span>previous 14 days</span></div><div class="stat"><b><button class="linkish" style="font-size:20px" data-rec="' + t.category + '|">' + s.n_all + ' of ' + s.total_all + '</button></b><span>all time</span></div><div class="stat"><b>' + pips(s.avg_severity) + '</b><span>average severity</span></div><div class="stat"><b><button class="linkish" style="font-size:20px" data-rec="' + t.category + '|churn">' + s.churn_records + '</button></b><span>also mention leaving</span></div></div></section>';
  const chart = '<section class="card"><div class="head"><h3>Share of each week’s feedback</h3><span class="muted small">Last two weeks highlighted · first and last weeks are partial</span></div>' + weeklyChart(t) + '</section>';
  const quotes = '<section class="card"><div class="head"><h3>In their words</h3><span class="muted small">Verified word for word</span></div><div class="quotes">' + t.quotes.map(quoteCard).join('') + '</div></section>';
  const breakdown = '<section class="card"><div class="head"><h3>By source</h3><span class="muted small">Records mentioning this theme</span></div>' + hbars(srcRows) + '<div class="head" style="margin-top:18px"><h3>By app version</h3><span class="muted small">Where versions are known</span></div>' + hbars(verRows) + '</section>';
  const subCard = '<section class="card"><div class="head"><h3>Sub-themes</h3><span class="muted small">Grouped by wording</span></div>' + subs.map(c => '<div class="sub"><span>' + esc(c.name.split(' · ')[1] || 'All mentions') + '</span><span class="muted">' + c.stats.n_all + ' records · ' + c.stats.n_recent + ' recent</span></div>').join('') + '</section>';
  const rec = D.recommendations.find(r => r.category === t.category);
  const recCard = rec ? '<section class="card"><div class="head"><h3>Recommended change</h3><button class="linkish" data-go="recommendations">Priority #' + rec.rank + '</button></div><p style="margin:0">' + esc(rec.change) + '</p></section>' : '';
  return picker + head + '<div class="grid2">' + chart + quotes + '</div><div class="grid2">' + breakdown + '<div style="display:grid;gap:16px;align-content:start">' + subCard + recCard + '</div></div>';
}

function highlight(text, phrase) {
  const i = phrase ? text.indexOf(phrase) : -1;
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(phrase) + '</mark>' + esc(text.slice(i + phrase.length));
}
function viewChurn() {
  const comp = {}; D.churn.forEach(c => { const k = c.competitor || 'No app named'; comp[k] = (comp[k] || 0) + 1; });
  const crows = Object.entries(comp).sort((a, b) => b[1] - a[1]).map(([k, n]) => ({ label: k === 'No app named' ? k : k.replace(/\b\w/g, m => m.toUpperCase()), n, total: D.churn.length }));
  const recent = D.churn.filter(c => inRecent(c.timestamp)).length, prior = D.churn.filter(c => inPrior(c.timestamp)).length;
  const sum = '<section class="card lead"><div class="eyebrow">Churn watchlist</div><p class="big">' + D.churn.length + ' of ' + D.meta.records + ' records (' + pct(D.churn.length, D.meta.records) + '%) say the customer may leave. ' + recent + ' in the last 14 days, ' + prior + ' in the 14 days before.</p><p class="muted small" style="margin:0">Each flag shows the exact phrase that triggered it. The detector uses wording rules, so phrases such as “taking my money elsewhere” are missed; see Eval health.</p></section>';
  const byTheme = {}; D.churn.forEach(c => (recById[c.record_id].themes || []).forEach(k => byTheme[k] = (byTheme[k] || 0) + 1));
  const trows = Object.entries(byTheme).sort((a, b) => b[1] - a[1]).map(([k, n]) => ({ label: themeBy[k].label, n, total: D.churn.length }));
  const cards = '<div class="grid2"><section class="card"><div class="head"><h3>Where they say they are going</h3></div>' + hbars(crows) + '</section><section class="card"><div class="head"><h3>Which problems come with it</h3></div>' + hbars(trows.slice(0, 6)) + '</section></div>';
  const list = '<section class="card flat"><div class="head" style="padding:16px 18px 0"><h3>Flagged records, newest first</h3></div><div class="scroll"><table><thead><tr><th>Date</th><th>Source</th><th>What they said</th><th>Problems</th></tr></thead><tbody>' +
    D.churn.slice(0, 40).map(c => { const r = recById[c.record_id]; return '<tr><td class="mono" style="white-space:nowrap">' + fmtD(c.timestamp) + '</td><td>' + esc(SRC[c.source] || c.source) + '</td><td class="rec-text">' + highlight(c.text, c.trigger_phrase) + '<div class="mono muted" style="margin-top:4px">' + esc(c.record_id) + '</div></td><td><div class="tags">' + r.themes.map(k => '<span class="chip small">' + esc(themeBy[k].label) + '</span>').join('') + '</div></td></tr>'; }).join('') + '</tbody></table></div></section>';
  return sum + cards + list;
}

function viewRecs() {
  const recs = D.recommendations;
  const intro = '<section class="card"><div class="head"><div><h2>Recommendations</h2><p class="muted small">One per theme, ranked by priority = impact ÷ effort. Impact blends recent share (45%), severity (25%), churn (20%) and trend (10%).</p></div></div>' + matrix(recs) + '</section>';
  const cards = recs.map(r => {
    const t = themeBy[r.category], st = state.status[r.category] || r.status;
    return '<section class="card rec"><div class="rec-top"><span class="rank">' + r.rank + '</span><div style="min-width:0;flex:1"><h3>' + esc(r.title) + (r.thin_evidence ? ' <span class="pill" data-tip="Based on fewer than 8 records: treat as a lead to check, not a conclusion">Thin evidence</span>' : '') + '</h3><p class="finding" style="font-size:16px;margin:4px 0 0">' + esc(r.finding) + '</p></div></div>' +
      '<div><div class="eyebrow">Proposed change</div><p style="margin:4px 0 0;max-width:70ch">' + esc(r.change) + '</p></div>' +
      '<dl class="kv" style="margin:0"><div><dt>Impact · effort · priority</dt><dd>' + r.impact + ' · ' + r.effort + '/5 · <b>' + r.priority + '</b></dd></div><div><dt>Effort estimate</dt><dd>' + esc(r.effort_text) + '</dd></div><div><dt>Owner</dt><dd>' + esc(r.owner) + '</dd></div><div><dt>Depends on</dt><dd>' + esc(r.dependencies) + '</dd></div><div><dt>Regulatory and security</dt><dd>' + esc(r.compliance) + '</dd></div><div><dt>Status</dt><dd><select data-status="' + r.category + '" aria-label="Status for ' + esc(r.title) + '">' + ['proposed', 'accepted', 'rejected', 'shipped'].map(o => '<option' + (o === st ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></dd></div></dl>' +
      '<div><div class="eyebrow" style="margin-bottom:6px">Evidence</div><div class="quotes">' + t.quotes.slice(0, 2).map(quoteCard).join('') + '</div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn" data-rec="' + r.category + '|recent">View the ' + t.stats.n_recent + ' recent records</button><span class="ai-note">Draft from rules and a playbook. Review before acting. Status changes stay in this browser.</span></div></section>';
  }).join('');
  return intro + cards;
}

function fmtScore(e) {
  if (e.unit === 'count') return e.score + ' found';
  if (e.unit === 'gap') return '+' + e.score.toFixed(1);
  if (e.unit && e.unit.startsWith('rate')) return Math.round(e.score * 100) + '% (max ' + Math.round(e.threshold * 100) + '%)';
  if (e.unit === 'score /5') return e.score.toFixed(2) + ' / 5';
  return e.score.toFixed(3);
}
function meter(e) {
  if (e.unit === 'ratio') return '<div class="meter"><i style="width:' + Math.min(100, e.score * 100) + '%"></i><b style="left:' + (e.threshold * 100) + '%" title="target"></b></div>';
  if (e.unit === 'score /5') return '<div class="meter"><i style="width:' + (e.score / 5 * 100) + '%"></i><b style="left:' + (e.threshold / 5 * 100) + '%"></b></div>';
  if (e.unit && e.unit.startsWith('rate')) return '<div class="meter"><i style="width:' + Math.min(100, e.score * 100 * 3) + '%;background:var(--warn)"></i><b style="left:' + (e.threshold * 100 * 3) + '%"></b></div>';
  return '';
}
function status(e) { return e.passed ? '<span class="pill good">✓ Pass</span>' : (e.kind === 'hard' ? '<span class="pill crit">✕ Fail</span>' : '<span class="pill">▲ Below target</span>'); }
function exList(items, label) { return items && items.length ? '<div><div class="eyebrow" style="margin-bottom:6px">' + label + '</div><div style="display:grid;gap:6px">' + items.map(x => '<div class="example"><span class="mono muted">' + esc(x.record_id || '') + '</span> ' + (x.predicted ? '<b>predicted: ' + esc(themeBy[x.predicted] ? themeBy[x.predicted].label : x.predicted) + '</b> ' : '') + (x.missed ? '<b>missed: ' + esc(themeBy[x.missed] ? themeBy[x.missed].label : x.missed) + '</b> ' : '') + '<br>' + esc(x.text) + '</div>').join('') + '</div></div>' : ''; }
function evDetail(e) {
  const d = e.detail; let h = '';
  if (e.id === 'extraction_f1') {
    h += '<div class="cols"><div><div class="eyebrow" style="margin-bottom:6px">Precision · recall · F1</div><p style="margin:0"><b>' + d.precision + '</b> · <b>' + d.recall + '</b> · <b>' + d.f1 + '</b></p><p class="muted small">Hinglish F1 ' + d.slices.hinglish.f1 + ' (' + d.slices.hinglish.support + ' cases) vs English ' + d.slices.english.f1 + ' (' + d.slices.english.support + ').</p></div></div>';
    h += '<div class="scroll"><table><thead><tr><th>Theme</th><th>Precision</th><th>Recall</th><th>F1</th><th>Cases</th></tr></thead><tbody>' + Object.entries(d.per_category).map(([k, v]) => '<tr><td>' + esc(k) + '</td><td>' + v.precision + '</td><td>' + v.recall + '</td><td>' + v.f1 + '</td><td>' + v.support + '</td></tr>').join('') + '</tbody></table></div>';
    h += '<div class="cols">' + exList(d.false_negatives, 'Missed by the pipeline') + exList(d.false_positives, 'Found but should not have been') + '</div>';
  } else if (e.id === 'churn_flags') {
    h += '<p style="margin:0">Precision <b>' + d.precision + '</b>, recall <b>' + d.recall + '</b>. Missed customers are the costly error, so recall is the headline.</p><div class="cols">' + exList(d.false_negatives, 'Leaving, but not flagged') + exList(d.false_positives, 'Flagged, but not leaving') + '</div>';
  } else if (e.id === 'hallucination_probe') {
    h += '<p style="margin:0">' + d.false_findings + ' of ' + d.clean_records + ' records with no complaint still produced a finding. Rule-based extraction cannot tell “no failed transactions” from “failed transaction” in every case.</p>' + exList(d.examples, 'Examples');
  } else if (e.id === 'count_accuracy') {
    h += '<p style="margin:0">' + d.checks + ' numbers in findings re-derived with an independent SQL query: ' + d.mismatches.length + ' mismatches. Self-test: a deliberately altered number was ' + (d.tamper_selftest_caught ? 'caught' : '<b>NOT caught</b>') + '.</p>';
  } else if (e.id === 'pii_leakage') {
    h += '<p style="margin:0">' + d.texts_scanned + ' texts scanned, ' + d.hits.length + ' leaks.</p><div class="note">Known gap: ' + esc(d.known_gap) + '. Add a name-recognition step before using real data.</div>';
  } else if (e.id === 'quote_grounding') {
    h += '<p style="margin:0">' + d.quotes_checked + ' quotes and trigger phrases checked as exact text from their cited record. Violations: ' + d.violations.length + '.</p>';
  } else if (e.id === 'recommendation_rubric') {
    h += '<div class="scroll"><table><thead><tr><th>#</th><th>Recommendation</th><th>Specific</th><th>Quantified</th><th>Grounded</th><th>Feasible</th><th>Traceable</th><th>Mean</th></tr></thead><tbody>' + d.per_recommendation.map(x => '<tr><td>' + x.rank + '</td><td>' + esc(x.title) + '</td><td>' + x.specific + '</td><td>' + x.quantified + '</td><td>' + x.grounded + '</td><td>' + x.feasible + '</td><td>' + x.traceable + '</td><td><b>' + x.mean + '</b></td></tr>').join('') + '</tbody></table></div><p class="muted small" style="margin:0">' + esc(d.judge) + '.</p>';
  } else if (e.id === 'judge_sanity') {
    h += '<div class="cols"><div class="example bad"><div class="eyebrow">Bad output · mean ' + d.bad.mean + '</div><p style="margin:6px 0 0">“' + esc(d.bad.text) + '”</p><p class="muted small" style="margin:6px 0 0">Specific ' + d.bad.specific + ' · Quantified ' + d.bad.quantified + ' · Grounded ' + d.bad.grounded + ' · Feasible ' + d.bad.feasible + ' · Traceable ' + d.bad.traceable + '</p></div><div class="example goodx"><div class="eyebrow">Good output · mean ' + d.good.mean + '</div><p style="margin:6px 0 0">“' + esc(d.good.text) + '”</p><p class="muted small" style="margin:6px 0 0">Specific ' + d.good.specific + ' · Quantified ' + d.good.quantified + ' · Grounded ' + d.good.grounded + ' · Feasible ' + d.good.feasible + ' · Traceable ' + d.good.traceable + '</p></div></div>';
  } else { h += '<pre class="mono" style="margin:0;white-space:pre-wrap">' + esc(JSON.stringify(d, null, 1)) + '</pre>'; }
  return h;
}
function viewEvals() {
  const E = D.evals, res = E.results;
  const hard = res.filter(e => e.kind === 'hard'), soft = res.filter(e => e.kind === 'soft');
  const hp = hard.filter(e => e.passed).length, sw = soft.filter(e => !e.passed).length;
  const sum = '<section class="card lead"><div class="eyebrow">Eval health</div><p class="big">' + (E.hard_gates_passed ? 'Release allowed: all ' + hard.length + ' hard checks pass.' : 'Release blocked: a hard check failed.') + (sw ? ' ' + sw + ' quality target' + (sw > 1 ? 's are' : ' is') + ' below target.' : '') + '</p>' +
    '<div class="note"><b>Read these scores with care.</b> The gold labels were written by the same generator that made the feedback, and the extraction rules were written against the same vocabulary, so extraction and churn scores are optimistic. Replace the gold set with 150+ human-labelled real records before trusting any quality number. The hard checks (counts, quotes, privacy, format) do not depend on labels and stay meaningful.</div></section>';
  const rows = res.map(e => '<details class="ev"><summary><span>' + status(e) + '</span><span><b>' + esc(e.name) + '</b><div class="muted small">' + (e.kind === 'hard' ? 'Hard gate: blocks release' : e.kind === 'soft' ? 'Quality target' : 'Monitor') + '</div></span><span class="meter-cell">' + meter(e) + '</span><span class="ev-score kind-cell">' + fmtScore(e) + '</span></summary><div class="body">' + evDetail(e) + '</div></details>').join('');
  return sum + '<section class="card flat">' + rows + '</section><p class="muted small" style="margin:0">Gold labels: ' + esc(E.golden_source || 'none') + '. Run <span class="mono">python run_pipeline.py</span> after any change to a prompt, rule or taxonomy; the run exits with an error if a hard gate fails.</p>';
}

function filteredRecords() {
  const f = state.f, q = f.q.trim().toLowerCase();
  return D.records.filter(r => (!f.theme || r.themes.includes(f.theme)) && (!f.source || r.source === f.source) && (!f.version || r.app_version === f.version) &&
    (!f.win || (f.win === 'recent' ? inRecent(r.timestamp) : inPrior(r.timestamp))) && (!f.churn || r.churn) && (!f.pain || r.themes.length) && (!q || r.text.toLowerCase().includes(q) || r.id.toLowerCase().includes(q)));
}
function viewRecords() {
  const f = state.f, list = filteredRecords();
  const opt = (v, l, sel) => '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(l) + '</option>';
  const bar = '<section class="card"><div class="head"><div><h2>Records</h2><p class="muted small">Every number in the dashboard resolves to these rows. Text shown is the redacted version.</p></div><b>' + list.length + ' of ' + D.records.length + '</b></div><div class="filters">' +
    '<select id="f-theme" aria-label="Theme">' + opt('', 'All themes', !f.theme) + themes.map(t => opt(t.category, t.label, f.theme === t.category)).join('') + '</select>' +
    '<select id="f-source" aria-label="Source">' + opt('', 'All sources', !f.source) + Object.keys(D.meta.sources).map(k => opt(k, SRC[k] || k, f.source === k)).join('') + '</select>' +
    '<select id="f-version" aria-label="App version">' + opt('', 'All versions', !f.version) + Object.keys(versionTotals).sort().map(v => opt(v, 'App v' + v, f.version === v)).join('') + '</select>' +
    '<select id="f-win" aria-label="Time window">' + opt('', 'All time', !f.win) + opt('recent', 'Last 14 days', f.win === 'recent') + opt('prior', 'Previous 14 days', f.win === 'prior') + '</select>' +
    '<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="f-pain"' + (f.pain ? ' checked' : '') + '> Only real pain points</label>' +
    '<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="f-churn"' + (f.churn ? ' checked' : '') + '> Mentions leaving</label>' +
    '<input type="search" id="f-q" placeholder="Search text or record ID" value="' + esc(f.q) + '" aria-label="Search records"></div></section>';
  const body = list.slice(0, state.shown).map(r => '<tr><td class="mono" style="white-space:nowrap">' + fmtD(r.timestamp) + '</td><td>' + esc(SRC[r.source] || r.source) + (r.app_version ? '<div class="mono muted">v' + esc(r.app_version) + '</div>' : '') + '</td><td class="rec-text">' + (r.churn ? highlight(r.text, r.churn.trigger_phrase) : esc(r.text)) + '<div class="mono muted" style="margin-top:4px">' + esc(r.id) + (r.synthetic ? ' · synthetic' : '') + '</div></td><td><div class="tags">' + (r.themes.length ? r.themes.map(k => '<span class="chip small">' + esc(themeBy[k] ? themeBy[k].label : k) + '</span>').join('') : '<span class="muted small">no pain point</span>') + '</div></td><td>' + (r.sev ? r.sev : '–') + '</td></tr>').join('');
  const more = list.length > state.shown ? '<div style="padding:12px 18px"><button class="btn" id="more">Show 60 more</button></div>' : '';
  return bar + '<section class="card flat"><div class="scroll"><table><thead><tr><th>Date</th><th>Source</th><th>Text</th><th>Themes</th><th>Sev.</th></tr></thead><tbody>' + (body || '<tr><td colspan="5" class="muted">No records match these filters.</td></tr>') + '</tbody></table></div>' + more + '</section>';
}

// ---------- shell
const VIEWS = { overview: ['Overview', viewOverview], themes: ['Theme detail', viewThemes], churn: ['Churn watchlist', viewChurn], recommendations: ['Recommendations', viewRecs], evals: ['Eval health', viewEvals], records: ['Records', viewRecords] };
function badge(k) { if (k === 'churn') return '<span class="count">' + D.churn.length + '</span>'; if (k === 'evals') { const n = D.evals.results.filter(e => !e.passed).length; return n ? '<span class="count">' + n + '</span>' : ''; } if (k === 'recommendations') return '<span class="count">' + D.recommendations.length + '</span>'; return ''; }
function renderTabs() { $('#tabs').innerHTML = Object.entries(VIEWS).map(([k, v]) => '<button class="tab" role="tab" data-go="' + k + '" aria-selected="' + (k === state.view) + '">' + v[0] + badge(k) + '</button>').join(''); }
function render(keepScroll) {
  const y = window.scrollY;
  renderTabs(); $('#main').innerHTML = VIEWS[state.view][1]();
  if (keepScroll) window.scrollTo(0, y);
}
function go(v, push) { state.view = v; state.shown = 60; render(false); window.scrollTo(0, 0); if (push !== false) { try { history.replaceState(null, '', '#' + v); } catch (e) { location.hash = v; } } }
function openRecords(p) { state.f = Object.assign({ theme: '', source: '', version: '', win: '', churn: false, pain: false, q: '' }, p); go('records'); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-theme-open],[data-pick],[data-sort],[data-rec],[data-open],#more');
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.themeOpen) { state.theme = t.dataset.themeOpen; LS.set('voc-theme', state.theme); return go('themes'); }
  if (t.dataset.pick) { state.theme = t.dataset.pick; LS.set('voc-theme', state.theme); return render(true); }
  if (t.dataset.sort) { state.sort = t.dataset.sort; return render(true); }
  if (t.dataset.rec) { const [th, w] = t.dataset.rec.split('|'); return openRecords({ theme: th, win: w === 'recent' ? 'recent' : '', churn: w === 'churn' }); }
  if (t.dataset.open) { return openRecords({ q: t.dataset.open }); }
  if (t.id === 'more') { state.shown += 60; render(true); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.status) { state.status[el.dataset.status] = el.value; LS.set('voc-status', state.status); return; }
  const map = { 'f-theme': 'theme', 'f-source': 'source', 'f-version': 'version', 'f-win': 'win' };
  if (map[el.id]) { state.f[map[el.id]] = el.value; state.shown = 60; render(true); }
  if (el.id === 'f-pain') { state.f.pain = el.checked; state.shown = 60; render(true); }
  if (el.id === 'f-churn') { state.f.churn = el.checked; state.shown = 60; render(true); }
});
let qT; document.addEventListener('input', e => { if (e.target.id === 'f-q') { clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => { state.f.q = v; state.shown = 60; render(true); const i = $('#f-q'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250); } });
const tip = $('#tip');
function showTip(e) { const t = e.target.closest('[data-tip]'); if (!t) { tip.style.opacity = 0; return; } tip.textContent = t.dataset.tip; tip.style.opacity = 1; const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8), y = e.clientY + 16; tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px'; }
document.addEventListener('mousemove', showTip); document.addEventListener('click', showTip); document.addEventListener('mouseleave', () => tip.style.opacity = 0);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS[h] && h !== state.view) go(h, false); });

$('#subtitle').textContent = 'UPI app feedback → product decisions';
$('#asof').textContent = D.meta.records + ' records · ' + Object.keys(D.meta.sources).length + ' sources · as of ' + fmtD(D.meta.as_of) + ' · backend: ' + D.meta.backend;
if (!D.meta.synthetic) { const sp = $('#synthetic-pill'); sp.textContent = 'Real public reviews'; sp.classList.add('good'); }
const h0 = location.hash.slice(1); if (VIEWS[h0]) state.view = h0;
render(false);
})();
</script>
